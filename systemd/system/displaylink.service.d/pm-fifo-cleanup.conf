# Remove DisplayLink's PM FIFOs whenever the service is not running.
#
# WHY: /usr/lib/systemd/system-sleep/displaylink.sh talks to DisplayLinkManager
# over /tmp/PmMessagesPort_{in,out}. On undock, udev stops the service and
# systemd SIGKILLs it ("State 'stop-sigterm' timed out"), so it never removes
# its FIFOs. A FIFO with no peer makes open() block FOREVER -- the script's
# `read -t 1` does not help, because open() blocks before the timeout applies.
# systemd then kills the hook at its 90s limit, and user.slice stays FROZEN that
# whole time (see man systemd-sleep), once before suspend and once after resume.
# Measured on wraith 2026-10-08: 90.02s each way vs 0.02s when the FIFOs are
# simply absent -- the script errors out instantly and harmlessly in that case.
#
# DisplayLinkManager recreates the FIFOs at startup (confirmed: PmMessagesPort_out
# appeared when the service started after the 2026-10-07 reboot), so clearing
# them on stop/start is safe. '-' prefix = ignore failure.
[Service]
ExecStartPre=-/usr/bin/rm -f /tmp/PmMessagesPort_in /tmp/PmMessagesPort_out
ExecStopPost=-/usr/bin/rm -f /tmp/PmMessagesPort_in /tmp/PmMessagesPort_out
