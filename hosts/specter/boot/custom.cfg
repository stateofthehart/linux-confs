# --- ThinkBook 16 G7 QOY device tree ------------------------------------
# Fedora 44 embeds this DTB in the kernel image (.dtbauto) but ships no CHID
# entry for this laptop in the .hwids table, so systemd-stub selects nothing,
# the kernel gets no device tree, and it resets before any console exists.
#
# Fix: hand GRUB the DTB explicitly. GRUB installs it into the EFI config
# table before StartImage(), and systemd-stub then skips CHID matching
# entirely (it is gated on !firmware_devicetree_exists()).
#
# /dtb is a symlink to dtb-<kernel-version>, so this follows kernel updates.
# custom.cfg is sourced by grub.cfg and is NOT regenerated by grub2-mkconfig.
#
# NOTE: requires Secure Boot OFF - GRUB disables devicetree under lockdown.
search --no-floppy --file --set=dtbdev /dtb/qcom/x1p42100-lenovo-thinkbook-16.dtb
if [ -n "$dtbdev" ]; then
  devicetree ($dtbdev)/dtb/qcom/x1p42100-lenovo-thinkbook-16.dtb
fi
