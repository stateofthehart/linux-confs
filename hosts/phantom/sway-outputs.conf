# phantom (desktop, Ubuntu 24.04, sway 1.9): two DisplayLink outputs driven by
# evdi + a patched wlroots. Both monitors report IDENTICAL EDID (XEC 4433,
# serial "Unknown"), so they can only be matched by connector name.
#
# Physical left/right is NOT verified — if they render swapped, exchange the
# two `position` values. Verify with:  swaymsg output DVI-I-1 power off
#
# 2560x1440@60 is the preferred mode. @144Hz exists but is ~2.4x the pixel
# throughput over USB/evdi — try it only after 60 Hz is stable.
#
# Install as ~/.config/sway/config.d/outputs.conf (the main sway config
# includes config.d/*.conf). Do NOT run kanshi on this host, and never set
# WLR_* variables in sway config or environment.d — phantom's sway wrapper
# owns WLR_EVDI_RENDER_DEVICE / WLR_DRM_DEVICES / LD_LIBRARY_PATH.
output DVI-I-1 mode 2560x1440@60Hz position 0,0    scale 1.0
output DVI-I-2 mode 2560x1440@60Hz position 2560,0 scale 1.0
