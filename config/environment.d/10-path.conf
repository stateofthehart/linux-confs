# systemd user-session environment.
#
# A graphical session started by a display manager (GDM) does NOT go through
# ~/.bash_profile or ~/.bashrc, so the PATH those set never applies to it.
# Measured on specter, a GDM-launched sway session:
#
#     PATH=/usr/local/bin:/usr/bin
#
# ~/.local/bin is missing, which silently breaks anything installed there.
# Concretely: sway runs `dex --autostart` to process ~/.config/autostart, dex
# lives in ~/.local/bin because Fedora does not package it, and sway reports
# nothing when an exec fails -- so autostart entries simply never ran and there
# was no error anywhere to notice.
#
# systemd reads this before starting the graphical session, so it applies to
# everything the session launches. Takes effect on next login.
#
# Do NOT put rendering or driver variables here (LIBGL_*, MESA_*, WLR_*): this
# file affects the WHOLE session, and those belong scoped to one program.
PATH=$HOME/.local/bin:$HOME/bin:$PATH
