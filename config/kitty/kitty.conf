font_family      JetBrainsMono Nerd Font
font_size        12.0

window_padding_width 8
cursor_shape         beam
cursor_blink_interval 0

enable_audio_bell no
visual_bell_duration 0.2

# Run `kitty +kitten themes` to pick a color theme — it appends an
# `include current-theme.conf` line below this one.


# BEGIN_KITTY_THEME
# Dracula
include current-theme.conf
# END_KITTY_THEME
